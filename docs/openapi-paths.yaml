openapi: 3.0.3
info:
  title: Paths
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Self-register as student or instructor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                passwordConfirm: { type: string }
                role: { type: string, enum: [student, instructor] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { description: Validation error }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { description: Invalid credentials }

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Issue a new access token from a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      responses:
        '200': { description: Success }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset code to email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Success }
        '404': { description: User not found }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  /api/v1/courses:
    get:
      tags: [Courses]
      summary: List courses (public + published only unless instructor/admin)
      security: []
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: level, schema: { type: string, enum: [beginner, intermediate, advanced, all] } }
        - { in: query, name: sort, schema: { type: string } }
        - { in: query, name: mine, schema: { type: string, enum: ['true', 'false'] }, description: 'Instructors only: show only my courses' }
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: integer }
                  paginationResult: { $ref: '#/components/schemas/Pagination' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Course' }
    post:
      tags: [Courses]
      summary: Create a course (instructor)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, category]
              properties:
                title: { type: string }
                subtitle: { type: string }
                description: { type: string }
                category: { type: string }
                price: { type: number }
                discountPrice: { type: number }
                level: { type: string, enum: [beginner, intermediate, advanced, all] }
                language: { type: string }
                isFree: { type: boolean }
                thumbnail: { type: string, format: binary }
                promoVideo: { type: string, format: binary }
                learningOutcomes: { type: array, items: { type: string } }
                requirements: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Course' }

  /api/v1/courses/{idOrSlug}:
    get:
      tags: [Courses]
      summary: Get a single course by ID or slug (includes sections & lectures)
      security: []
      parameters:
        - { in: path, name: idOrSlug, required: true, schema: { type: string } }
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Course' }
                  isEnrolled: { type: boolean }
        '404': { description: Not found }

  /api/v1/courses/{id}/publish:
    post:
      tags: [Courses]
      summary: Submit course for review or publish (admin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Course updated }

  /api/v1/courses/{courseId}/sections:
    get:
      tags: [Curriculum]
      summary: List sections of a course
      security: []
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      responses:
        '200': { description: Sections }
    post:
      tags: [Curriculum]
      summary: Create section (instructor)
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                order: { type: integer }
      responses:
        '201': { description: Created }

  /api/v1/sections/{sectionId}/lectures:
    post:
      tags: [Curriculum]
      summary: Create lecture inside a section (video upload supported)
      parameters:
        - { in: path, name: sectionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                type: { type: string, enum: [video, article, quiz, assignment] }
                article: { type: string }
                order: { type: integer }
                durationSeconds: { type: integer }
                isPreview: { type: boolean }
                video: { type: string, format: binary }
                attachments:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Lecture created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lecture' }

  /api/v1/courses/{courseId}/enroll:
    post:
      tags: [Enrollments]
      summary: Enroll in a free course directly
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      responses:
        '201': { description: Enrolled }
        '402': { description: Course requires payment }

  /api/v1/courses/{courseId}/progress:
    get:
      tags: [Enrollments]
      summary: Get my progress in a course
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Enrollment' }
    post:
      tags: [Enrollments]
      summary: Mark a lecture as completed
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lectureId]
              properties:
                lectureId: { type: string }
      responses:
        '200': { description: Progress updated }

  /api/v1/enrollments/me:
    get:
      tags: [Enrollments]
      summary: List my enrollments
      responses:
        '200': { description: My enrollments }

  /api/v1/instructors/me/dashboard:
    get:
      tags: [Instructors]
      summary: Instructor aggregated dashboard stats
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalCourses: { type: integer }
                      publishedCourses: { type: integer }
                      totalStudents: { type: integer }
                      totalRevenue: { type: number }
                      averageRating: { type: number }
                      totalReviews: { type: integer }

  /api/v1/payments/checkout:
    post:
      tags: [Payments]
      summary: Create Stripe checkout session for current cart
      responses:
        '200':
          description: Stripe URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  paymentId: { type: string }

  /api/v1/certificates/courses/{courseId}/issue:
    post:
      tags: [Certificates]
      summary: Issue certificate after 100% completion
      parameters:
        - { in: path, name: courseId, required: true, schema: { type: string } }
      responses:
        '201': { description: Certificate issued }

  /api/v1/certificates/verify/{serial}:
    get:
      tags: [Certificates]
      summary: Public certificate verification by serial
      security: []
      parameters:
        - { in: path, name: serial, required: true, schema: { type: string } }
      responses:
        '200': { description: Valid }
        '404': { description: Not found }
